<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/pico.jade.min.css" />
    <link rel="stylesheet" href="/css/styles.css" />

    <!-- Embed -->
    <meta content="Mods - NSMB Central" property="og:title" />
    <meta content="https://raw.githubusercontent.com/NSMBC/NSMBC.github.io/refs/heads/main/assets/images/NSMB_Central_Logo.png" property="og:image" />
    <meta content="Here's a list of the mods available on NSMB Central." property="og:description" />
    <meta content="#00b60f" data-react-helmet="true" name="theme-color" />

    <title>Mods List</title>
    <style>
        body {
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main article {
            background: rgba(30, 30, 30, 0.8);
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin: 2rem auto;
            max-width: 1200px;
        }

        .mods-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            padding: 1rem 0;
        }

        .mod-card {
            background: var(--card-background-color, #1a1a1a);
            border-radius: 12px;
            padding: 1.5rem;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            border: 1px solid var(--card-border-color, #333);
            color: var(--text-color, #e0e0e0);
        }

        .mod-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
            border-color: var(--primary, #4dabf7);
        }

        .mod-card h2 {
            margin: 0 0 0.5rem 0;
            font-size: 1.25rem;
            color: var(--primary, #4dabf7);
        }

        .mod-card p {
            margin: 0;
            color: var(--text-muted, #a0a0a0);
            font-size: 0.9rem;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            max-height: 5.4em; /* 4 lines * 1.35 line-height */
            line-height: 1.35;
        }

        /* Content section styling */
        #contentSection {
            display: none;
            margin-top: 2rem;
            background: var(--background-color, #1a1a1a);
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color, #333);
            opacity: 0;
            transition: opacity 0.3s ease-out;
        }

        #contentSection.active {
            display: block;
            opacity: 1;
            animation: slideDown 0.3s ease-out;
        }

        #contentSection.closing {
            opacity: 0;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #contentSection header {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border-color, #333);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #contentSection header h2 {
            margin: 0;
            font-size: 1.1rem;
        }

        #closeContent {
            background: none;
            border: none;
            font-size: 1.25rem;
            cursor: pointer;
            padding: 0.25rem;
            color: var(--text-muted, #a0a0a0);
            transition: color 0.2s;
        }

        #closeContent:hover {
            color: var(--primary, #4dabf7);
        }

        #contentFrame {
            width: 100%;
            border: none;
            min-height: 700px;
            background: var(--background-color, #1a1a1a);
        }

        /* Markdown styling */
        .markdown-content {
            padding: 1.5rem;
            font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
            line-height: 1.6;
            color: var(--text-color, #e0e0e0);
        }

        .markdown-content a {
            color: var(--primary, #4dabf7);
            text-decoration: none;
            transition: color 0.2s;
        }

        .markdown-content a:hover {
            color: #74c0fc;
            text-decoration: underline;
        }

        .markdown-content h1, .markdown-content h2, .markdown-content h3, 
        .markdown-content h4, .markdown-content h5, .markdown-content h6 { 
            color: var(--primary, #4dabf7);
        }

        .markdown-content code { 
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--primary, #4dabf7);
        }

        .markdown-content pre { 
            background-color: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color, #333);
        }

        .markdown-content blockquote { 
            color: var(--text-muted, #a0a0a0);
            border-left-color: var(--border-color, #333);
        }

        .markdown-content table th { 
            background-color: rgba(0, 0, 0, 0.2);
            border-color: var(--border-color, #333);
        }

        .markdown-content table td { 
            border-color: var(--border-color, #333);
        }

        .markdown-content table tr { 
            background-color: transparent;
            border-top-color: var(--border-color, #333);
        }

        .markdown-content table tr:nth-child(2n) { 
            background-color: rgba(0, 0, 0, 0.1);
        }

        .markdown-content img,
        .markdown-content iframe {
            max-width: 100%;
        }

        .markdown-content img {
            height: auto;
        }

        /* Smooth scroll behavior */
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body>
<div id="navbar"></div>
<main class="container-fluid">
    <article>
        <h1>Available Mods</h1>
        <p>Explore our collection of New Super Mario Bros. mods. Click on any mod to learn more about it.</p>
        <hr>
        <div class="mods-grid">
            <!-- MOD_CARDS -->
        </div>

        <section id="contentSection">
            <header>
                <h2 id="contentTitle"></h2>
                <button id="closeContent" aria-label="Close">&times;</button>
            </header>
            <iframe
                id="contentFrame"
                title="Mod Content"
                sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox allow-downloads"
            ></iframe>
        </section>
    </article>
</main>

<script src="/js/load-nav.js"></script>
<script src="/js/vendor/marked.umd.js"></script>
<script src="/js/vendor/purify.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const contentSection = document.getElementById("contentSection");
        const contentFrame = document.getElementById("contentFrame");
        const contentTitle = document.getElementById("contentTitle");
        const closeContent = document.getElementById("closeContent");
        const markdownStyles = document.querySelector("style").textContent;
        const readmeSandbox = "allow-scripts allow-popups allow-popups-to-escape-sandbox allow-downloads";
        const indexSandbox = `${readmeSandbox} allow-same-origin`;
        const allowedIframeAttrs = new Set([
            "allow",
            "allowfullscreen",
            "frameborder",
            "height",
            "loading",
            "referrerpolicy",
            "src",
            "title",
            "width"
        ]);

        function escapeAttribute(value) {
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/"/g, "&quot;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
        }

        function allowedYouTubeEmbed(src) {
            try {
                const url = new URL(src, window.location.href);
                const host = url.hostname.toLowerCase().replace(/^www\./, "");
                const allowedHost = host === "youtube.com" || host === "youtube-nocookie.com";

                if (!allowedHost || !url.pathname.startsWith("/embed/")) {
                    return null;
                }

                url.protocol = "https:";
                return url.href;
            } catch (error) {
                return null;
            }
        }

        function sanitizeMarkdown(markdownHtml) {
            const sanitizedHtml = DOMPurify.sanitize(markdownHtml, {
                USE_PROFILES: { html: true },
                ADD_TAGS: ["iframe"],
                ADD_ATTR: ["allow", "allowfullscreen", "frameborder", "loading", "referrerpolicy"],
                FORBID_TAGS: ["script", "style"],
                FORBID_ATTR: ["style"]
            });
            const template = document.createElement("template");
            template.innerHTML = sanitizedHtml;

            template.content.querySelectorAll("iframe").forEach(iframe => {
                const safeSrc = allowedYouTubeEmbed(iframe.getAttribute("src") || "");

                if (!safeSrc) {
                    iframe.remove();
                    return;
                }

                for (const attribute of Array.from(iframe.attributes)) {
                    if (!allowedIframeAttrs.has(attribute.name.toLowerCase())) {
                        iframe.removeAttribute(attribute.name);
                    }
                }

                iframe.setAttribute("src", safeSrc);
                iframe.setAttribute("loading", "lazy");
                iframe.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");
                iframe.setAttribute("allowfullscreen", "");
                iframe.setAttribute("allow", "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share");
            });

            template.content.querySelectorAll("a").forEach(anchor => {
                anchor.setAttribute("target", "_blank");
                anchor.setAttribute("rel", "noopener noreferrer");
            });

            return template.innerHTML;
        }

        function setFrameDocument(markdownHtml, baseHref) {
            const safeContent = sanitizeMarkdown(markdownHtml);
            contentFrame.setAttribute("sandbox", readmeSandbox);
            contentFrame.removeAttribute("src");
            contentFrame.srcdoc = `
                <!DOCTYPE html>
                <html lang="en">
                <head>
                    <base href="${escapeAttribute(baseHref)}">
                    <style>
                        body {
                            background-color: var(--background-color, #1a1a1a);
                            color: var(--text-color, #e0e0e0);
                            margin: 0;
                            padding: 0;
                        }
                        ${markdownStyles}
                    </style>
                </head>
                <body>
                    <div class="markdown-content">${safeContent}</div>
                </body>
                </html>
            `;
        }

        function setFrameError(message) {
            setFrameDocument(`<p>${message}</p>`, window.location.href);
        }

        function loadReadme(href) {
            fetch(href + "README.md")
                .then(response => {
                    if (!response.ok) {
                        throw new Error("README.md was not found.");
                    }

                    return response.text();
                })
                .then(data => {
                    const markdownContent = marked.parse(data, { gfm: true });
                    const baseHref = new URL(href, window.location.href).href;
                    setFrameDocument(markdownContent, baseHref);
                })
                .catch(error => {
                    console.error("Error loading README.md:", error);
                    setFrameError("This mod page could not be loaded.");
                });
        }

        function loadIndex(href) {
            // Custom pages need same-origin access for local @font-face assets.
            contentFrame.setAttribute("sandbox", indexSandbox);
            contentFrame.removeAttribute("srcdoc");
            contentFrame.src = href + "index.html";
        }

        document.querySelectorAll(".mod-card").forEach(card => {
            card.addEventListener("click", function() {
                const href = this.getAttribute("data-href");
                const entry = this.getAttribute("data-entry");
                const title = this.querySelector("h2").textContent;
                
                contentTitle.textContent = title;
                contentSection.classList.add("active");

                if (entry === "index") {
                    loadIndex(href);
                } else if (entry === "readme") {
                    loadReadme(href);
                } else {
                    setFrameError("This mod page has no README.md or index.html file.");
                }

                // Scroll to content section
                contentSection.scrollIntoView({ behavior: "smooth" });
            });
        });

        closeContent.addEventListener("click", function() {
            contentSection.classList.add("closing");
            setTimeout(() => {
                contentSection.classList.remove("active", "closing");
                contentFrame.src = "about:blank";
                contentFrame.removeAttribute("srcdoc");
                contentFrame.setAttribute("sandbox", readmeSandbox);
                // Scroll back to top of mods grid
                document.querySelector(".mods-grid").scrollIntoView({ behavior: "smooth" });
            }, 300);
        });
    });
</script>
</body>
</html>
